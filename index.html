<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consecutivo de Informes · Laboratorio de Materiales</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="brand">
    <span class="mark">LAB</span>
    <div>
      <h1>Consecutivo de Informes</h1>
      <div class="sub">Laboratorio de Materiales</div>
    </div>
  </div>

  <!-- ---------- Pantalla de login ---------- -->
  <div id="login-screen" class="login-wrap">
    <div class="card">
      <div id="login-error" class="error-msg hidden"></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" id="login-btn">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- ---------- Panel principal ---------- -->
  <div id="app-screen" class="app-wrap hidden">
    <div class="topbar">
      <div class="who">Sesión de <strong id="who-name">—</strong></div>
      <button class="btn-secondary" id="logout-btn">Cerrar sesión</button>
    </div>

    <div class="card">
      <div id="app-error" class="error-msg hidden"></div>
      <div id="app-ok" class="ok-msg hidden"></div>

      <!-- Estado inicial: botón para tomar número -->
      <div id="ticket-idle" class="ticket">
        <div class="ticket-eyebrow">Próximo consecutivo</div>
        <div class="ticket-number">?</div>
        <div class="ticket-hint">Describe el proyecto para tomar y asignar el número.</div>

        <form id="assign-form" class="assign-form">
          <div class="field">
            <label for="description">Descripción del proyecto (máx. 255 caracteres)</label>
            <textarea id="description" rows="3" maxlength="255" required></textarea>
            <div class="charcount" id="charcount">0 / 255</div>
          </div>
          <button type="submit" class="btn-primary" id="assign-btn">Tomar y asignar número</button>
        </form>
      </div>

      <!-- Estado tras asignar: confirmación -->
      <div id="ticket-done" class="ticket hidden">
        <div class="ticket-eyebrow">Número asignado</div>
        <div class="ticket-number" id="assigned-number">000000</div>
        <div class="ticket-hint" id="assigned-summary"></div>
        <button class="btn-secondary" id="assign-another-btn" style="margin-top:16px;">Asignar otro número</button>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Historial de consecutivos</p>
      <div id="records-loading" class="muted">Cargando historial…</div>
      <table id="records-table" class="hidden">
        <thead>
          <tr>
            <th>N.°</th>
            <th>Usuario</th>
            <th>Descripción</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
      <div id="records-empty" class="empty-state hidden">Todavía no se ha asignado ningún número.</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
